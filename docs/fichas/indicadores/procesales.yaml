nombre: Distribución procesal y cercanía a prescripción declarada
funcion: decla.analitica.indicadores.ind_procesales
unidad: registro
fecha_de_referencia: hoy (fecha de ejecución) vs. CASO_FECHA_PRESCRIPCION declarada
numerador: count(*) por etapa_norm; count(*) con (fecha_prescripcion_declarada - hoy) entre 0 y 365 días
denominador: no aplica (conteo absoluto por etapa)
limitaciones:
  - Cerca de prescripción usa el valor de CASO_FECHA_PRESCRIPCION que el sistema declaró, no
    una regla fija de hecho más 20 años. Esa regla no se sostiene en los datos reales (ADR
    0008, solo 19.1% de cumplimiento exacto). No se valida ni se corrige la fecha declarada,
    solo se informa su cercanía a hoy.
  - No mide eficacia de la investigación, solo distribución procesal registrada.
