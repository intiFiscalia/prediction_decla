nombre: Calidad del lote (reexposición de plata.reporte_calidad)
funcion: decla.analitica.indicadores.ind_calidad
unidad: lote / ejecución
fecha_de_referencia: no aplica
numerador: conteos por categoría (cuarentena, alcance_excluido, fechas_imputadas,
  fechas_invalidas, territorio_metodo_hechos, calidad_coord_hechos, delito.no_parseable)
denominador: no aplica (cada fila ya es un conteo; ver plata.registros_limpios para el total)
limitaciones:
  - Es la misma tabla que escribe decla.normalizacion.orquestador::procesar_plata; este
    indicador solo la vuelve a exponer en la capa oro para que el informe no tenga que leer
    plata directamente.
  - Confianza de mapeo territorial y de coordenadas depende de que data/referencia/divipola.csv
    y cartografia/municipios.geojson sigan vigentes.
