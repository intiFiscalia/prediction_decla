nombre: Rezagos procesales (medianas)
funcion: decla.analitica.indicadores.ind_rezagos
unidad: registro
fecha_de_referencia: no aplica (agregado de todo el periodo cargado)
numerador: mediana(dias_hecho_denuncia), mediana(dias_denuncia_creacion), mediana(dias_creacion_asignacion)
denominador: no aplica
limitaciones:
  - Usa mediana, no promedio, para no dejar que valores extremos (fechas inválidas que sí
    parsean pero son absurdas) distorsionen el indicador.
  - Solo entran los pares de fechas donde ambas son válidas (dias_* es NULL si falta alguna).
