nombre: Cociente de localización por municipio y delito
funcion: decla.analitica.indicadores.ind_territorio_cociente_localizacion
unidad: registro
fecha_de_referencia: no aplica (agregado de todo el periodo cargado)
numerador: participación del delito dentro del municipio (n_delito_mpio / n_total_mpio)
denominador: participación nacional del mismo delito (n_delito_nacional / n_total_nacional)
formula: "LQ = (n_mpio_delito / n_total_mpio) / (n_nacional_delito / n_total_nacional)"
limitaciones:
  - No requiere población: es una comparación de participaciones, no una tasa poblacional.
  - LQ > 1 significa que el delito está sobrerrepresentado en ese municipio frente al país,
    dentro del universo ya filtrado por alcance (ADR 0008); no implica mayor incidencia real.
  - Con pocos registros por municipio, el LQ es inestable; revisar n antes de interpretar.
