nombre: Conteo territorial
funcion: decla.analitica.indicadores.ind_territorio_conteo
unidad: registro
fecha_de_referencia: FECHA_CREACION (año ISO) — misma referencia que usó I0
numerador: count(*) por (cod_dpto_hechos, cod_mpio_hechos, año)
denominador: no aplica (conteo absoluto)
limitaciones:
  - Solo cuenta filas con cod_mpio_hechos resuelto (exacto/normalizado/difuso/manual); las
    "no_resoluble" quedan fuera de este indicador y se reportan aparte (calidad territorial).
  - Es el lugar de los HECHOS, no el de la unidad que tramita (ver plan_trabajo.md §8.2 sobre
    la matriz origen-destino para esa distinción).
