nombre: Composición por delito
funcion: decla.analitica.indicadores.ind_composicion_delito
unidad: registro
fecha_de_referencia: no aplica
numerador: count(*) por (delito_nombre, articulo_cp) en plata.registros_limpios
denominador: total de registros en plata.registros_limpios (dentro del alcance temático)
formula: "pct = n / total * 100"
limitaciones:
  - El valor "(no parseable)" agrupa los DELITO que no calzaron con el patrón esperado (ver
    delito_parseable en plata.registros_limpios); no se asume un valor para ellos.
  - "El alcance ya está limitado a Lavado de Activos (ADR 0008); esta composición es la de los
    artículos dentro de ese alcance, no la de todo el universo de delitos del sistema."
