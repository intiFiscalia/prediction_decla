nombre: Noticias por fenómeno (conteo, participación, % no clasificado)
funcion: decla.analitica.indicadores.ind_fenomenos
unidad: noticia (registro_uid de texto.relato_procesado)
fecha_de_referencia: no aplica (lee la asignación vigente de la taxonomía congelada)
numerador: n_noticias por codigo_fenomeno en fenomenos.asignacion_fenomeno; fila
  "(no_clasificado)" = relatos sin ninguna fila en asignacion_fenomeno
denominador: total de filas en texto.relato_procesado (universo que entró al descubrimiento,
  Fase 6)
limitaciones:
  - "pct_participacion se calcula contra el total de relatos, no contra la suma de n_noticias de
    todos los fenómenos: esa suma puede superar el 100 %. Dos de los cuatro fenómenos de v1.0
    vienen de la partición de HDBSCAN y los otros dos de la partición de NMF (ver
    decla.fenomenos.asignacion); un mismo relato puede caer en un grupo aprobado de cada
    partición a la vez. No es evidencia de que el relato describa dos mecanismos distintos, es
    un efecto de mezclar dos particiones distintas del mismo corpus para construir la taxonomía."
  - "'Conteo ajustado' (plan_trabajo.md §7.4, suma de probabilidades) no se reporta aparte: toda
    probabilidad en v1.0 es 1.0 (membresía de clustering), coincide exactamente con n_noticias.
    Un conteo ajustado real requiere el clasificador supervisado de la Fase 9 (I4)."
  - La asignación depende de la versión de taxonomía congelada (version_taxonomia en
    fenomenos.asignacion_fenomeno); si se recongela la taxonomía, este indicador cambia aunque
    los relatos no cambien.
  - Mide actividad institucional registrada agrupada por un patrón semántico descubierto, nunca
    incidencia real del fenómeno.
