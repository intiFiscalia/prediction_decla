# Contrato versionado del esquema de origen (CLAUDE.md §4.8, §4.4).
#
# Fuente de verdad de las 40 columnas de CASOS y 2 de RELATOS: la muestra real descrita en
# CLAUDE.md §4 (no el inventario original de 28 columnas del plan, que no es un archivo de este
# repo). Las columnas aquí coinciden deliberadamente con `scripts/generar_fixtures.py` para que los
# fixtures sintéticos y este contrato nunca diverjan sin que alguien lo note.
#
# Columnas nuevas frente al inventario original de 28 (CLAUDE.md §4.4): RUPTURA, TIPO_NOTICIA,
# CASO_LEY, LEY, SECC_DESCRIPCION, CAPITULO, FECHA_ULTIMA_ACTUACION, FECHA_REGISTRO_ACTUACION,
# ULTIMA_ACTUACION, OTROS_DELITOS, DESP_CONOCIDO_CASO_TIT, DESP_CONOCIDO_CASO_APOYO,
# CASO_GRUPO_ESPECIALIZADO, "Eje temático APLICA".
#
# IMPORTANTE: "Eje temático APLICA" NO se declara alias de EJE_TEMATICO (CLAUDE.md §4.5): no hay
# evidencia de que sean equivalentes. Si en el dataset real aparece EJE_TEMATICO, el validador debe
# reportarlo como hallazgo nuevo, no fusionarlo con "Eje temático APLICA".

version: 1

tablas:
  CASOS:
    llave: CASO_NOTICIA
    columnas:
      CASO_NOTICIA: {obligatoria: true, tipo_esperado: identificador}
      CASO_ID: {obligatoria: true, tipo_esperado: identificador}
      DESP_ID: {obligatoria: true, tipo_esperado: identificador}
      TIPO_NOTICIA: {obligatoria: false, tipo_esperado: categorico}
      CASO_LEY: {obligatoria: false, tipo_esperado: categorico}
      LEY: {obligatoria: false, tipo_esperado: categorico}
      ESTADO: {obligatoria: true, tipo_esperado: categorico}
      ETAPA: {obligatoria: true, tipo_esperado: categorico}
      TIPO_DILIGENCIA: {obligatoria: false, tipo_esperado: categorico}
      FECHA_HECHO: {obligatoria: true, tipo_esperado: fecha}
      CASO_FECHA_DENUNCIA: {obligatoria: false, tipo_esperado: fecha}
      FECHA_CREACION: {obligatoria: true, tipo_esperado: fecha}
      CASO_FECHA_REG_NC: {obligatoria: false, tipo_esperado: fecha}
      FECHA_ASIGNACION: {obligatoria: false, tipo_esperado: fecha}
      CASO_FECHA_PRESCRIPCION: {obligatoria: false, tipo_esperado: fecha}
      FECHA_ULTIMA_ACTUACION: {obligatoria: false, tipo_esperado: fecha}
      FECHA_REGISTRO_ACTUACION: {obligatoria: false, tipo_esperado: fecha}
      ULTIMA_ACTUACION: {obligatoria: false, tipo_esperado: categorico}
      DELITO: {obligatoria: true, tipo_esperado: texto_estructurado}
      OTROS_DELITOS: {obligatoria: false, tipo_esperado: texto_estructurado}
      TITULO: {obligatoria: false, tipo_esperado: categorico}
      CAPITULO: {obligatoria: false, tipo_esperado: categorico}
      SECC_DESCRIPCION: {obligatoria: false, tipo_esperado: categorico}
      RUPTURA: {obligatoria: false, tipo_esperado: categorico}
      NO_CASOS_CONEXOS: {obligatoria: false, tipo_esperado: numerico}
      COMPETENCIA_DESPACHO: {obligatoria: false, tipo_esperado: categorico}
      DESP_CONOCIDO_CASO_TIT: {obligatoria: false, tipo_esperado: categorico}
      DESP_CONOCIDO_CASO_APOYO: {obligatoria: false, tipo_esperado: categorico}
      CASO_GRUPO_ESPECIALIZADO: {obligatoria: false, tipo_esperado: categorico}
      DEPARTAMENTO_HECHOS: {obligatoria: true, tipo_esperado: territorio}
      MUNICIPIO_HECHOS: {obligatoria: true, tipo_esperado: territorio}
      DEPARTAMENTO_UNIDAD: {obligatoria: false, tipo_esperado: territorio}
      MUNICIPIO_UNIDAD: {obligatoria: false, tipo_esperado: territorio}
      LAT_DIR_HECHOS: {obligatoria: false, tipo_esperado: coordenada}
      LONG_DIR_HECHOS: {obligatoria: false, tipo_esperado: coordenada}
      NUMERO_DOCUMENTO: {obligatoria: false, tipo_esperado: identificador_sensible}
      FISCAL_ASIGNADO_DESPACHO: {obligatoria: false, tipo_esperado: nombre_servidor}
      "Eje temático APLICA": {obligatoria: false, tipo_esperado: categorico}
      DESPACHO: {obligatoria: false, tipo_esperado: categorico}
      PAIS_HECHOS: {obligatoria: false, tipo_esperado: categorico}
      # Columna heredada del inventario original; no se asume equivalente a "Eje temático APLICA"
      # (CLAUDE.md §4.5). Si aparece en el dataset real, se reporta como hallazgo, no se fusiona.
      EJE_TEMATICO: {obligatoria: false, tipo_esperado: categorico, heredada: true}

  RELATOS:
    llave: CASO_NOTICIA
    columnas:
      CASO_NOTICIA: {obligatoria: true, tipo_esperado: identificador}
      RELATO: {obligatoria: true, tipo_esperado: texto_libre}
