version: 1
# Umbrales de confianza para clasificaciones por similitud (plan_trabajo.md §6.4; Fase 5).
# Valores recalibrados a mano (2026-10-27) tras observar, con multilingual-e5-base, que la
# similitud coseno entre un texto corto y las ~500 descripciones CIIU queda comprimida en una
# banda angosta (textos irrelevantes: ~0,73-0,81; textos relevantes: ~0,86-0,90): un margen
# top1-top2 de 0,1 (valor inicial sin calibrar) rechazaba incluso casos inequívocos ("extracción
# de oro" con margen real de 0,013), y una confianza mínima de 0,5 aceptaba hasta un texto sobre
# el clima. Siguen sin ser definitivos: se calibraron con 4 oraciones sintéticas de desarrollo,
# no con la muestra de anotación real (50-100 relatos, mini-compuerta 2B) — se ajustan ahí.
sector_inferido:
  confianza_minima: 0.85
  margen_minimo_top2: 0.01
  # Si la confianza del top-1 es menor a confianza_minima, o la diferencia con el top-2 es menor
  # a margen_minimo_top2, el sector queda "indeterminado" (CLAUDE.md: no forzar una etiqueta).
zero_shot_mecanismo:
  confianza_minima: 0.85
  margen_minimo_top2: 0.01
segmentacion_densidad:
  # Umbral de proporción de tokens administrativos por oración (config/diccionarios/
  # vocabulario_administrativo.yaml) por debajo del cual una oración se considera ya parte del
  # hecho, no del encabezado de trámite. Calibrado (2026-10-29) con oraciones sintéticas propias
  # (nunca con relatos reales, CLAUDE.md §2.1): oraciones de hecho (ej. "Los investigadores
  # hallaron mercancía...") miden 0,00-0,08; 6 de 8 encabezados sintéticos de
  # scripts/generar_fixtures.py miden 0,11-0,50. 0,10 separa ambos grupos sin solaparlos.
  # Dos encabezados (estilos "cooperación internacional" y "control vial") usan redacción
  # genérica sin vocabulario claramente administrativo y miden 0,04-0,05: quedan sin detectar
  # por este método (los captura el método por frase exacta si la frase coincide literal).
  # Pendiente de recalibrar con `calcular_cobertura_densidad` cuando la persona corra `make nlp`
  # sobre datos reales.
  umbral_densidad: 0.10
  min_tokens_oracion: 4
emergencia:
  # Reglas de declaración de fenómeno emergente (plan_trabajo.md §8.5): valores tomados
  # directamente de los que el propio plan sugiere como punto de partida ("FDR ≤ 10 %,
  # persistencia ≥ 2–3 periodos, tamaño mínimo ≥ 5-10, > 1 unidad registradora"), no calibrados
  # todavía con retroprueba real — el dataset real solo cubre 10 meses (I2 §4-bis), muy poca
  # historia para calibrar formalmente. Se recalibran cuando haya más periodos o cuando la
  # persona revise los resultados de la retroprueba (plan §8.5, "validación por un analista").
  fdr_maximo: 0.10
  persistencia_minima_periodos: 2
  tamanio_minimo_absoluto: 5
  minimo_unidades_registradoras: 2
  # Umbrales de los detectores (decla.emergencia.detectores) — documentados ahí también, no son
  # valores mágicos escondidos en el código.
  cusum_k: 0.5
  cusum_h: 4.0
  ears_umbral_c: 3.0
  farrington_umbral_desviaciones: 2.58
  farrington_umbral_anscombe_outlier: 1.0
deriva:
  # Lectura de PSI (plan_trabajo.md Fase 12): umbrales estándar de la literatura de riesgo
  # crediticio (no inventados para este proyecto) — < 0,1 sin cambio relevante, 0,1-0,25 cambio
  # moderado, > 0,25 cambio significativo (dispara revisión). decla.ingesta.lote y decla.comun.
  # deriva los calculan; sin retroprueba real todavía (un solo lote procesado hasta ahora).
  psi_moderado: 0.10
  psi_significativo: 0.25
clasificador_fenomeno:
  # Clasificador multietiqueta de fenómenos sobre el relato completo (plan_trabajo.md §7.3; ADR
  # 0024 reabre esta pieza de I4, cerrada como "no viable todavía" en I4_cierre.md por falta de
  # anotación). `minimo_ejemplos_por_codigo` es el piso que pidió ese veredicto (50-100 relatos
  # por clase) — `decla.fenomenos.clasificador.verificar_cobertura_minima` lo hace cumplir antes
  # de entrenar, no es solo documentación. `confianza_minima` queda sin calibrar: no hay relatos
  # anotados por fenómeno todavía (CLAUDE.md: no inventar un umbral sin evidencia).
  minimo_ejemplos_por_codigo: 50
  confianza_minima: pendiente_de_calibrar
