# Vocabulario administrativo/procesal común en actas policiales, informes FPJ y denuncias
# colombianas (plan_trabajo.md §6.1 paso 3; CLAUDE.md §4.21). Conocimiento general del dominio
# (no proviene de relatos reales): se usa para medir, oración por oración, qué tan "de trámite"
# es el texto, en vez de buscar frases exactas (CLAUDE.md §4.21: "algunos empiezan a mitad de
# contexto" — una frase fija nunca cubre toda la variación real de redacción).
