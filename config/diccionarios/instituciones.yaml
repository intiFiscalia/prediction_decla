  - sigla: EJERCITO
    nombre: Ejército Nacional de Colombia
    variantes: ["Ejército Nacional", "Ejército Nacional de Colombia"]
  - sigla: MIGRACION
    nombre: Migración Colombia
    variantes: ["Migración Colombia"]
  - sigla: POLICIA
    nombre: Policía Nacional de Colombia
    variantes: ["Policía Nacional", "Policía Nacional de Colombia"]
