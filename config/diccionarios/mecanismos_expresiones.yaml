version: 1
# Expresiones literales -> código de mecanismo (config/categorias_menciones.yaml, categoría
# "mecanismo"). Mismo patrón que sectores_expresiones.yaml: capa EXPLÍCITA (evidencia literal,
# confianza=1.0), que se intenta antes del modelo zero-shot (decla.conocimiento.zero_shot). Si
# ninguna expresión aparece, el relato sigue cayendo al modelo — esta capa nunca cierra la
# puerta a que el modelo encuentre un mecanismo que el diccionario no anticipó.
#
# Semilla inicial (2026-11-06), SIN validar contra una muestra real: pendiente de que la persona
# (que conoce el corpus) la revise, corrija y amplíe con lo que surja en la anotación real —
# igual que advierte sectores_expresiones.yaml para su propio diccionario. No se usa como
# verdad de terreno hasta esa revisión.
